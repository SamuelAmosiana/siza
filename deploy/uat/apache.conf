# Small worker pool: the host has little free memory and UAT has few visitors.
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 2
    MaxRequestWorkers 6
    MaxConnectionsPerChild 500
</IfModule>

ServerName siza-uat.samuelsianamate.com
ServerTokens Prod
ServerSignature Off

# UAT is private. The file is written at container start from .env.uat.
<Directory /var/www/html/public>
    AuthType Basic
    AuthName "SIZA UAT"
    AuthUserFile /etc/apache2/uat.htpasswd
    Require valid-user
</Directory>
